name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Every action is pinned to a full commit SHA; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: make ci
      - name: Stream summary (job summary)
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          clickgen --events 100000 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Known-vulnerability audit
        run: make audit

  # Generator to a real Kafka broker and back: order, content and window results unchanged.
  kafka:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      kafka:
        image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
        ports:
          - 9092:9092
    env:
      KAFKA_BOOTSTRAP: localhost:9092
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,kafka]"
      - name: Wait for the broker
        run: |
          for i in $(seq 1 60); do
            python -c "from confluent_kafka.admin import AdminClient; AdminClient({'bootstrap.servers': 'localhost:9092'}).list_topics(timeout=2)" && exit 0
            sleep 2
          done
          exit 1
      - run: python -m pytest -q -m kafka -rs

  # The PyFlink job compared with the reference engine (Flink ships Linux and macOS wheels only).
  flink:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,flink]"
      - name: PyFlink tests
        shell: bash
        run: python -m pytest -q -m flink -rs --tb=short -p no:warnings 2>&1 | tee pytest-flink.log
      - name: Failing output as an annotation (logs need signing in)
        if: failure()
        run: tail -n 40 pytest-flink.log | python3 -c "import sys; print('::error title=pytest -m flink (last lines)::' + sys.stdin.read().replace('%', '%25').replace('\r', '').replace('\n', '%0A'))"
